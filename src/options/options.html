<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CartIQ Settings</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="cartiq-options-page">
    <header class="cartiq-options-header">
      <img src="../../assets/icons/icon-48.png" alt="" width="32" height="32" />
      <h1 data-i18n="options_title">CartIQ Settings</h1>
    </header>

    <section class="cartiq-card">
      <label for="apiKeyInput" data-i18n="options_apiKeyLabel">Claude API key</label>
      <input id="apiKeyInput" type="password" data-i18n-placeholder="options_apiKeyPlaceholder" autocomplete="off" />
      <p class="cartiq-muted" data-i18n="options_apiKeyHelp"></p>
      <button id="saveBtn" class="cartiq-btn-primary" data-i18n="options_save">Save</button>
      <span id="savedNotice" class="cartiq-muted" hidden data-i18n="options_saved"></span>
    </section>

    <section class="cartiq-card">
      <label for="langSelect" data-i18n="options_language">Language</label>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="he">עברית</option>
      </select>

      <label for="themeSelect" data-i18n="options_theme">Theme</label>
      <select id="themeSelect">
        <option value="system" data-i18n="options_theme_system">Match system</option>
        <option value="light" data-i18n="options_theme_light">Light</option>
        <option value="dark" data-i18n="options_theme_dark">Dark</option>
      </select>
    </section>

    <section class="cartiq-card">
      <h2 data-i18n="options_detectionTitle">Duplicate detection</h2>
      <label for="thresholdRange" data-i18n="options_similarityLabel">Duplicate sensitivity</label>
      <input id="thresholdRange" type="range" min="0.3" max="0.9" step="0.05" />
      <span id="thresholdValue" class="cartiq-muted"></span>
      <p class="cartiq-muted" data-i18n="options_similarityHelp"></p>
    </section>

    <section class="cartiq-card">
      <h2 data-i18n="options_watchTitle">Price-drop watch</h2>
      <label class="cartiq-checkbox-row">
        <input id="watchEnabled" type="checkbox" />
        <span data-i18n="options_watchEnable">Notify me about price drops in open cart tabs</span>
      </label>
      <label for="watchInterval" data-i18n="options_watchInterval">Check every (minutes)</label>
      <input id="watchInterval" type="number" min="15" max="720" step="15" />
      <p class="cartiq-muted" data-i18n="options_watchHelp"></p>
    </section>

    <section class="cartiq-card cartiq-about">
      <h2 data-i18n="options_about">About CartIQ</h2>
      <p>CartIQ v<span id="versionLabel"></span></p>
      <p>© 2026 CartIQ. All rights reserved.</p>
      <a href="../../PRIVACY.md" target="_blank" data-i18n="options_privacyLink">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="../../EULA.md" target="_blank" data-i18n="options_eulaLink">License Agreement</a>
    </section>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
