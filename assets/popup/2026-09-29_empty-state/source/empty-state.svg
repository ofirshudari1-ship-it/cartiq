<svg width="240" height="160" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="cartiq-empty-blob" x1="0" y1="0" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0EA5A4" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- soft background blob, readable on both light and dark surfaces -->
  <ellipse cx="120" cy="82" rx="98" ry="66" fill="url(#cartiq-empty-blob)"/>

  <!-- shopping cart, brand indigo -->
  <g transform="translate(58,46)" fill="none" stroke="#4F46E5" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2h11l7.2 36.2a5.4 5.4 0 0 0 5.3 4.3h24.3a5.4 5.4 0 0 0 5.3-4.3L61 14H16"/>
    <circle cx="26" cy="56" r="4.4" fill="#4F46E5" stroke="none"/>
    <circle cx="51" cy="56" r="4.4" fill="#4F46E5" stroke="none"/>
  </g>

  <!-- one item highlighted inside the cart, teal -->
  <rect x="78" y="54" width="26" height="20" rx="5" fill="#0EA5A4" opacity="0.85"/>

  <!-- magnifying glass scanning the cart, accent orange ring + indigo handle -->
  <g transform="translate(126,70)">
    <circle cx="20" cy="20" r="17" fill="#F8FAFC" stroke="#FF7A45" stroke-width="4.4"/>
    <line x1="32" y1="32" x2="46" y2="46" stroke="#FF7A45" stroke-width="5.2" stroke-linecap="round"/>
  </g>

  <!-- AI sparkle, top-right -->
  <g transform="translate(158,26)">
    <path d="M9 0 L11.7 6.3 L18 9 L11.7 11.7 L9 18 L6.3 11.7 L0 9 L6.3 6.3 Z" fill="#FF7A45"/>
  </g>
  <g transform="translate(46,20)">
    <path d="M5.5 0 L7.1 3.85 L11 5.5 L7.1 7.15 L5.5 11 L3.85 7.15 L0 5.5 L3.85 3.85 Z" fill="#0EA5A4" opacity="0.8"/>
  </g>
</svg>
