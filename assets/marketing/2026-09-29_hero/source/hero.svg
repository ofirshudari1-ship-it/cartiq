<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CartIQ — illustration of an AI layer scanning an AliExpress-style shopping cart, flagging a duplicate item and a cheaper alternative">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <circle cx="1360" cy="140" r="260" fill="#ffffff" opacity="0.06"/>
  <circle cx="120" cy="800" r="220" fill="#ffffff" opacity="0.05"/>

  <!-- floating white product-panel -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="130" width="740" height="640" rx="32" fill="#F8FAFC"/>
  </g>

  <!-- panel header: mini cart icon + title bar -->
  <g transform="translate(470,178)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#cartGrad)"/>
    <g transform="translate(11,14) scale(1.3)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1.4" fill="#ffffff" stroke="none"/>
      <circle cx="19" cy="21" r="1.4" fill="#ffffff" stroke="none"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.02a2 2 0 0 0 2-1.61L22.5 6H6"/>
    </g>
    <rect x="70" y="4" width="220" height="18" rx="9" fill="#0F172A" opacity="0.85"/>
    <rect x="70" y="30" width="140" height="12" rx="6" fill="#94A3B8"/>
  </g>

  <!-- cart line items -->
  <g transform="translate(470,266)" font-family="Rubik, Arial, sans-serif">
    <!-- item 1 -->
    <rect x="0" y="0" width="660" height="86" rx="18" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="20" y="18" width="50" height="50" rx="12" fill="#E2E8F0"/>
    <rect x="88" y="24" width="260" height="14" rx="7" fill="#334155"/>
    <rect x="88" y="46" width="140" height="10" rx="5" fill="#94A3B8"/>
    <rect x="560" y="30" width="80" height="26" rx="13" fill="#4F46E5"/>

    <!-- item 2: flagged duplicate -->
    <g transform="translate(0,104)">
      <rect x="0" y="0" width="660" height="86" rx="18" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="20" y="18" width="50" height="50" rx="12" fill="#FDE68A"/>
      <rect x="88" y="18" width="260" height="14" rx="7" fill="#334155"/>
      <rect x="88" y="40" width="180" height="10" rx="5" fill="#B45309"/>
      <g transform="translate(88,58)">
        <rect x="0" y="0" width="118" height="22" rx="11" fill="#F59E0B"/>
        <text x="59" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2x duplicate</text>
      </g>
      <rect x="560" y="30" width="80" height="26" rx="13" fill="#F59E0B"/>
    </g>

    <!-- item 3: cheaper alternative found -->
    <g transform="translate(0,208)">
      <rect x="0" y="0" width="660" height="86" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
      <rect x="20" y="18" width="50" height="50" rx="12" fill="#BBF7D0"/>
      <rect x="88" y="18" width="240" height="14" rx="7" fill="#334155"/>
      <g transform="translate(88,40)">
        <rect x="0" y="0" width="150" height="22" rx="11" fill="#16A34A"/>
        <text x="75" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">-18% found</text>
      </g>
      <rect x="560" y="30" width="80" height="26" rx="13" fill="#16A34A"/>
    </g>
  </g>

  <!-- AI summary strip at bottom of panel -->
  <g transform="translate(470,600)">
    <rect x="0" y="0" width="660" height="120" rx="20" fill="#0F172A"/>
    <g transform="translate(24,24)">
      <path d="M16 0 L20.8 11.2 L32 16 L20.8 20.8 L16 32 L11.2 20.8 L0 16 L11.2 11.2 Z" fill="#FF7A45"/>
    </g>
    <rect x="70" y="26" width="300" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="70" y="48" width="480" height="10" rx="5" fill="#94A3B8"/>
    <rect x="70" y="66" width="420" height="10" rx="5" fill="#94A3B8"/>
    <rect x="24" y="86" width="150" height="20" rx="10" fill="#0EA5A4"/>
  </g>

  <!-- floating "seller trust" badge, top-right, overlapping panel -->
  <g filter="url(#softShadow)" transform="translate(1080,90)">
    <rect x="0" y="0" width="210" height="94" rx="20" fill="#ffffff"/>
    <circle cx="34" cy="47" r="20" fill="#16A34A"/>
    <path d="M25 47 l6 6 l12 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="26" width="120" height="12" rx="6" fill="#0F172A"/>
    <rect x="66" y="46" width="90" height="10" rx="5" fill="#94A3B8"/>
    <rect x="66" y="64" width="70" height="16" rx="8" fill="#DCFCE7"/>
  </g>

  <!-- floating tab-compare badge, bottom-left, overlapping panel -->
  <g filter="url(#softShadow)" transform="translate(150,520)">
    <rect x="0" y="0" width="230" height="150" rx="22" fill="#ffffff"/>
    <g transform="translate(24,24)" font-family="Rubik, Arial, sans-serif">
      <rect x="0" y="0" width="182" height="26" rx="8" fill="#EEF2FF"/>
      <text x="91" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#4F46E5">Compare tabs ⇄</text>
      <rect x="0" y="38" width="182" height="20" rx="8" fill="#F1F5F9"/>
      <rect x="0" y="66" width="182" height="20" rx="8" fill="#F1F5F9"/>
      <rect x="0" y="94" width="120" height="20" rx="8" fill="#F1F5F9"/>
      <rect x="150" y="38" width="32" height="20" rx="8" fill="#4F46E5"/>
    </g>
  </g>

  <!-- large sparkle accent, upper-left of scene -->
  <g transform="translate(300,120)">
    <path d="M24 0 L31.2 16.8 L48 24 L31.2 31.2 L24 48 L16.8 31.2 L0 24 L16.8 16.8 Z" fill="#FF7A45" opacity="0.9"/>
  </g>
  <g transform="translate(1260,700)">
    <path d="M16 0 L20.8 11.2 L32 16 L20.8 20.8 L16 32 L11.2 20.8 L0 16 L11.2 11.2 Z" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
